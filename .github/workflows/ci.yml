name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo check
        run: cargo check --all-targets --all-features

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        # RUSTSEC-2020-0021 (rio, critical, no fixed upgrade available):
        # transitive via sqlitegraph >=3.5.0's `native-v3` async I/O backend
        # (Linux-only, non-optional dependency). atheneum uses sqlitegraph's
        # default `sqlite-backend` only — the `native-v3` feature that
        # exercises rio is never enabled, so the vulnerable code path is
        # compiled but unreachable. Revisit once sqlitegraph makes rio
        # optional behind the native-v3 feature.
        run: cargo audit --ignore RUSTSEC-2020-0021

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo test
        run: cargo test --all-features

  lint:
    name: Semgrep + Docs
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep OSS scan
        run: semgrep ci --oss-only --config p/rust

      - name: Check public docs for AI/LLM terminology
        run: |
          if grep -riE "\bLLM\b|\bAI assistant\b|production-ready" README.md MANUAL.md CHANGELOG.md Cargo.toml crates/atheneum/README.md crates/atheneum/MANUAL.md crates/atheneum/CHANGELOG.md crates/atheneum/Cargo.toml 2>/dev/null; then
            echo "FAIL: AI/LLM terminology found in public documentation"
            exit 1
          fi

      - name: Check license is GPL-3.0 only
        run: |
          if grep -q "GPL-3.0-or-later" Cargo.toml; then
            echo "FAIL: License must be GPL-3.0 only, not GPL-3.0-or-later"
            exit 1
          fi
