# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
# bincode 1.3.3 is unmaintained but functional. The team considers it complete.
# This is NOT a CVE — it's an abandonment advisory. No safe upgrade exists.
# sqlitegraph depends on bincode for serialization; replacing it is a major refactor.
ignore = [
    "RUSTSEC-2025-0141",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "GPL-3.0-only",
    "GPL-3.0",
    "Zlib",
    "BSL-1.0",
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
