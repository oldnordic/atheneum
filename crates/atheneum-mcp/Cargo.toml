[package]
name = "atheneum-mcp"
version = "0.8.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP server for Atheneum — agent memory and knowledge graph tools"
readme = "README.md"
keywords = ["mcp", "atheneum", "agent", "memory", "tools"]
categories = ["command-line-utilities", "database-implementations"]

[[bin]]
name = "atheneum-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
rmcp = { version = "1.7", features = ["server", "transport-io"] }
tokio = { version = "1.44", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
shellexpand = "3.1"

# Used unconditionally by the event tool's envoy adapter (events.rs), and
# by HttpBackend when the `http` feature is enabled.
reqwest = { version = "0.12", features = ["json"] }

# Direct mode deps
atheneum = { version = "0.14.0", path = "../atheneum", optional = true }

[features]
default = ["direct"]
http = []
direct = ["dep:atheneum"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.19"
rusqlite = "0.31"
